name: publish-charts

on:
  push:
    branches: ["main"]
    paths:
      - "charts/**"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      # The releaser packages with `helm package -u`, which resolves Chart.yaml
      # dependencies, and Helm 3 resolves an HTTP repository only once it is
      # registered. Keep in step with chart-repos in .ct.yaml.
      - name: Register dependency repositories
        run: helm repo add kyverno-api https://kyverno.github.io/api

      - name: Run chart-releaser
        uses: bitdeps/helm-oci-charts-releaser@v0.1.5
        with:
            oci_registry: ghcr.io/thaum-xyz/helm-charts
            oci_username: thaum-xyz
            oci_password: ${{ secrets.GITHUB_TOKEN }}
            github_token: ${{ secrets.GITHUB_TOKEN }}
            skip_existing: true
            skip_helm_install: true
            mark_as_latest: false
