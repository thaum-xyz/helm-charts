name: chart-testing

on:
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/chart-testing.yaml"
      - ".ct.yaml"
  push:
    branches: ["main", "master"]
    paths:
      - "charts/**"
      - ".github/workflows/chart-testing.yaml"
      - ".ct.yaml"

permissions:
  contents: read

jobs:
  ct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: v3.21.4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: helm/chart-testing-action@v2

      - name: Lint
        run: ct lint --config .ct.yaml

      # Charts that render only custom resources cannot be installed into a bare
      # kind cluster, and installing them would only prove the CRDs accept the
      # manifests. The schema check below does that without a cluster.
      - name: Validate rendered manifests against schemas
        env:
          # renovate: datasource=github-releases depName=yannh/kubeconform
          KUBECONFORM_VERSION: v0.8.0
          CRD_CATALOG: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
        run: |
          curl -sSL --fail \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          rc=0
          for chart in charts/*/; do
            [ -d "$chart/ci" ] || continue
            for values in "$chart"ci/*-values.yaml; do
              [ -f "$values" ] || continue
              echo "::group::$(basename "$chart") <- $(basename "$values")"
              if ! helm template t "$chart" -n ci -f "$values" \
                   | kubeconform -strict -summary \
                       -schema-location default \
                       -schema-location "$CRD_CATALOG" -; then
                rc=1
              fi
              echo "::endgroup::"
            done
          done
          exit $rc

      # Values documentation is generated from the "# --" comments in values.yaml,
      # so it cannot drift from the chart unless someone forgets to regenerate.
      # Checking it here rather than auto-committing keeps the README in the same
      # commit as the values change that caused it.
      - name: Check generated chart docs are up to date
        env:
          # renovate: datasource=github-releases depName=norwoodj/helm-docs extractVersion=^v(?<version>.+)$
          HELM_DOCS_VERSION: 1.14.2
        run: |
          curl -sSL --fail \
            "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin helm-docs
          helm-docs --chart-search-root=charts
          # git-status rather than git-diff: diff ignores untracked files, so a
          # new chart with no generated README would pass silently.
          out="$(git status --porcelain -- 'charts/*/README.md')"
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::charts/*/README.md is out of date. Run 'make docs' and commit the result."
            exit 1
          fi

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.0

      # cnpg-database renders only CRs (Cluster, ObjectStore, ExternalSecret,
      # PrometheusRule), so it needs four operators' CRDs to install. It is
      # covered by the schema check above instead.
      - name: Install
        run: ct install --config .ct.yaml --excluded-charts cnpg-database
