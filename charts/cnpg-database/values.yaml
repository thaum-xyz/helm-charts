# -- Value of the app.kubernetes.io/name label. Defaults to "postgres" rather
# than the chart name, because that is what the existing manifests use.
nameOverride: ""
# -- Resource name stem. Defaults to .Release.Name.
# IMPORTANT: this must render to the same name the cluster already uses, because
# CloudNativePG derives the read-write Service from it (`<fullname>-rw`) and that
# hostname is hardcoded by every consumer. Do not let it become
# "<release>-<chart>".
fullnameOverride: ""

# -- Application database name. Required unless cluster.bootstrap.enabled=false.
database: ""
# -- Owning role. Defaults to .Values.database. Also used as the username in the
# user ExternalSecret, so it is needed even when bootstrap is disabled.
owner: ""

# -- Adds helm.sh/resource-policy: keep to the Cluster and ObjectStore so no
# Helm action (including an install-remediation uninstall) can delete the Cluster
# and, through its ownerReferences, its PVCs.
retain: true

cluster:
  instances: 2
  # -- The chart owns the version, so clusters do not have to pin one and drift
  # apart. Left unset, CloudNativePG defaults it at creation and freezes that
  # value into the spec forever, which is how one fleet ended up spanning 15.2
  # to 18.1 with nobody choosing any of it.
  # 17 on bookworm matches the VectorChord image immich needs, so photos is not
  # a major-version outlier. Overriding this is for clusters that cannot follow:
  # changing the major triggers an offline pg_upgrade, and PostgreSQL has no
  # downgrade path at all.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-standard-bookworm
  # -- Empty means omit spec.primaryUpdateMethod.
  primaryUpdateMethod: ""
  monitoring:
    enablePodMonitor: true
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  storage:
    size: 2Gi
    storageClass: lvm-thin
  # -- Deliberately empty. Helm deep-merges maps, so a default limits block could
  # not be removed by omission in a per-instance values file -- it would silently
  # impose limits on the clusters that intentionally set requests only.
  resources: {}
  # -- Passthrough for spec.postgresql (parameters, shared_preload_libraries...).
  # The parameters below bound WAL growth; a per-database values file can
  # override any single key, because Helm deep-merges maps.
  postgresql:
    parameters:
      # A replica that goes away keeps its replication slot, and with the CNPG
      # default of -1 the primary retains WAL for it forever. kured reboots a
      # node three mornings a week, so this is not hypothetical: it filled
      # pocket-id's volume and took the database down with it.
      max_slot_wal_keep_size: "512MB"
      # Slots already guarantee retention, so this only sets a floor. 512MB (the
      # default) was most of the WAL sitting on every volume.
      wal_keep_size: "128MB"
      # Full-page images dominate WAL on small, frequently-touched databases.
      # lz4 over zstd for CPU; both exist in every image in use, back to 15.2.
      wal_compression: "lz4"
      # WAL segments are 16MB whatever they hold, so a forced switch every 5
      # minutes (the CNPG default) bought ~3GB/day of mostly padding on a 13MB
      # database. 15 minutes trades RPO for that.
      archive_timeout: "900s"
      # Fewer checkpoints, fewer full-page writes. Costs recovery time.
      checkpoint_timeout: "900s"
  bootstrap:
    # -- false omits spec.bootstrap entirely. Needed for clusters that are
    # already initialised and have no bootstrap stanza in their live spec;
    # adding one can be rejected by the validating webhook.
    enabled: true
    postInitSQL: []
    postInitApplicationSQL: []
  # -- Extra annotations on the Cluster.
  annotations: {}

backup:
  enabled: true
  schedule: "0 17 23 * * *"
  suspend: false
  backupOwnerReference: self
  pluginName: barman-cloud.cloudnative-pg.io
  objectStore:
    # -- NOT derived from the release name: several namespaces host more than one
    # cluster and each needs its own store.
    name: versity
    # -- Varies per database (3d to 30d in practice); no safe default beyond this.
    retentionPolicy: 30d
    bucketPrefix: s3://cnpg/postgres
    # -- Required. Note this is not always the namespace name.
    pathSuffix: ""
    # -- Escape hatch; wins over bucketPrefix/pathSuffix.
    destinationPath: ""
    # -- The in-cluster gateway. Backblaze was the previous target; every cluster
    # moved off it, so a new one defaulting there would have been a silent
    # regression.
    endpointURL: http://versitygw.cnpg-system.svc.cluster.local:7070
    wal:
      compression: gzip
    credentials:
      # -- Empty means <fullname>-backup.
      secretName: ""
      accessKeyKey: S3_ACCESS_KEY
      secretKeyKey: S3_SECRET_KEY

pooler:
  enabled: false
  # -- Live name is "pooler", not "<fullname>-pooler".
  name: pooler
  instances: 2
  type: rw
  monitoring:
    enablePodMonitor: true
  pgbouncer:
    poolMode: session
    parameters:
      max_client_conn: "1000"
      default_pool_size: "10"
  # -- Resource requests and limits for the operator-managed pgbouncer container.
  resources: {}
  podLabel: pooler

externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-auth-api
  # -- Extra annotations on the ExternalSecret objects themselves. Empty by
  # default, and deliberately so: annotations here do NOT reach the generated
  # Secret. External Secrets copies spec.target.template metadata onto the
  # Secret, and falls back to copying the ExternalSecret's own metadata only
  # when no template is set at all. Use secretLabels below for anything the
  # operator has to see.
  annotations: {}
  secret:
    # -- Metadata for the generated Secrets, passed through verbatim as
    # spec.target.template.metadata, so both `labels` and `annotations` work and
    # the shape matches the External Secrets API rather than inventing one.
    #
    # cnpg.io/reload is a *label*, not an annotation, and belongs on the Secret,
    # not on the ExternalSecret. CloudNativePG documents it under predefined
    # labels: "Available on ConfigMap and Secret resources. When set to true, a
    # change in the resource is automatically reloaded by the operator." This is
    # the only placement that makes a rotated password actually get picked up.
    #
    # Set to `null` -- not `{}` -- to render no template metadata at all: Helm
    # deep-merges maps, so `{}` leaves the default below in place.
    metadata:
      labels:
        cnpg.io/reload: "true"
  admin:
    # -- Doppler key for the superuser password. Required.
    remoteKey: ""
    username: postgres
  user:
    # -- Doppler key for the application password. Required.
    remoteKey: ""
    # -- Empty falls back to .Values.owner, then .Values.database.
    username: ""
  backup:
    accessKeyRemoteKey: POSTGRES_S3_ACCESS_KEY
    secretKeyRemoteKey: POSTGRES_S3_SECRET_KEY

prometheusRule:
  # -- Backup alerting. Deliberately built on the barman plugin's own metrics
  # (barman_cloud_cloudnative_pg_io_*) and NOT on cnpg_collector_*: the built-in
  # collector metrics read 0 for plugin-method backups, so an alert on them would
  # fire constantly while telling you nothing.
  enabled: true
  # -- Warn when the newest backup is older than this many seconds (default 2d).
  maxBackupAgeSeconds: 172800
