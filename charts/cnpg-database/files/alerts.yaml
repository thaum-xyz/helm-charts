groups:
  - name: cnpg-database-backups
    rules:
      # Built on the barman plugin's own metrics, not cnpg_collector_*. The
      # built-in collector metrics report 0 for plugin-method backups, so an
      # alert on them fires forever while telling you nothing.
      #
      # Aggregated by job, which carries "<namespace>/<cluster>", because a
      # namespace can hold several clusters. max() picks the primary: replicas
      # report 0.
      #
      # Selected on this release's own job. Every database installs this chart,
      # so without it each release evaluates the same cluster-wide query and the
      # fleet loads one identical copy of each alert per release. Scoping by
      # namespace alone would not be enough: vod-arr holds three clusters.
      - alert: CNPGBackupTooOld
        expr: |
          time() - max by (namespace, job) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{job="{{ .Release.Namespace }}/{{ include "cnpg-database.fullname" . }}"} > 0)
            > {{ .Values.prometheusRule.maxBackupAgeSeconds }}
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL backup for {{ `{{ $labels.job }}` }} is stale
          description: >-
            The newest barman-cloud backup for {{ `{{ $labels.job }}` }} is
            {{ `{{ $value | humanizeDuration }}` }} old, past the
            {{ .Values.prometheusRule.maxBackupAgeSeconds }}s threshold. Check
            the ScheduledBackup status: if lastCheckTime is frozen the controller
            may be stuck retrying an already-existing Backup name.

      - alert: CNPGBackupMissing
        expr: |
          max by (namespace, job) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{job="{{ .Release.Namespace }}/{{ include "cnpg-database.fullname" . }}"}) == 0
        for: 6h
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL cluster {{ `{{ $labels.job }}` }} has no backup
          description: >-
            No barman-cloud backup has ever been recorded for
            {{ `{{ $labels.job }}` }}. CloudNativePG PVCs are owned by the
            Cluster and the storage class reclaims on delete, so this cluster has
            no recovery path at all.

      - alert: CNPGBackupFailing
        expr: |
          max by (namespace, job) (barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{job="{{ .Release.Namespace }}/{{ include "cnpg-database.fullname" . }}"})
            > max by (namespace, job) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{job="{{ .Release.Namespace }}/{{ include "cnpg-database.fullname" . }}"})
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL backup for {{ `{{ $labels.job }}` }} is failing
          description: >-
            The last backup attempt for {{ `{{ $labels.job }}` }} failed more
            recently than the last success, so backups are running but not
            completing.

  # Moved here from a single cluster-wide PrometheusRule that lived alongside the
  # CNPG operator. Every rule in it described databases running in other
  # namespaces, and every release matched every other release's clusters, so a
  # threshold could not be tuned for one database without moving it for all
  # eleven. Scoped by job -- "<namespace>/<cluster>" -- for the same reason the
  # backup rules above are.
  - name: cnpg-database
    rules:
      - alert: LongRunningTransaction
        expr: |
          cnpg_backends_max_tx_duration_seconds{job="{{ .Release.Namespace }}/{{ include "cnpg-database.fullname" . }}"} > {{ .Values.prometheusRule.maxTransactionSeconds }}
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A transaction on {{ `{{ $labels.job }}` }} has been open too long
          description: >-
            A backend on {{ `{{ $labels.pod }}` }} has held a transaction open for
            {{ `{{ $value | humanizeDuration }}` }}, past the
            {{ .Values.prometheusRule.maxTransactionSeconds }}s threshold. A
            transaction left open holds back vacuum and can block other writers.

      # Upstream annotates this as "waiting longer than 5 minutes", which
      # misreads the metric: cnpg_backends_waiting_total counts backends blocked
      # on locks, it is not a duration.
      - alert: BackendsWaiting
        expr: |
          cnpg_backends_waiting_total{job="{{ .Release.Namespace }}/{{ include "cnpg-database.fullname" . }}"} > {{ .Values.prometheusRule.maxBackendsWaiting }}
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Backends on {{ `{{ $labels.job }}` }} are blocked on locks
          description: >-
            {{ `{{ $value }}` }} backends on {{ `{{ $labels.pod }}` }} are waiting
            on locks, past the {{ .Values.prometheusRule.maxBackendsWaiting }}
            threshold.

      - alert: PGDatabaseXIDAge
        expr: |
          cnpg_pg_database_xid_age{job="{{ .Release.Namespace }}/{{ include "cnpg-database.fullname" . }}"} > {{ .Values.prometheusRule.maxXidAge }}
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Transaction ID age on {{ `{{ $labels.job }}` }} is high
          description: >-
            {{ `{{ $labels.pod }}` }} is {{ `{{ $value }}` }} transactions past
            its frozen XID. Left unchecked this ends in a wraparound shutdown.

      - alert: PGReplicationLag
        expr: |
          cnpg_pg_replication_lag{job="{{ .Release.Namespace }}/{{ include "cnpg-database.fullname" . }}"} > {{ .Values.prometheusRule.maxReplicationLagSeconds }}
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Standby of {{ `{{ $labels.job }}` }} is lagging
          description: >-
            The standby is {{ `{{ $value | humanizeDuration }}` }} behind the
            primary, past the
            {{ .Values.prometheusRule.maxReplicationLagSeconds }}s threshold.

      - alert: LastFailedArchiveTime
        expr: |
          (cnpg_pg_stat_archiver_last_failed_time{job="{{ .Release.Namespace }}/{{ include "cnpg-database.fullname" . }}"} - cnpg_pg_stat_archiver_last_archived_time{job="{{ .Release.Namespace }}/{{ include "cnpg-database.fullname" . }}"}) > 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: WAL archiving on {{ `{{ $labels.job }}` }} is failing
          description: >-
            {{ `{{ $labels.pod }}` }} failed to archive WAL more recently than it
            last succeeded. Recovery depends on an unbroken WAL chain.

      - alert: DatabaseDeadlockConflicts
        expr: |
          cnpg_pg_stat_database_deadlocks{job="{{ .Release.Namespace }}/{{ include "cnpg-database.fullname" . }}"} > {{ .Values.prometheusRule.maxDeadlocks }}
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Deadlocks on {{ `{{ $labels.job }}` }}
          description: >-
            {{ `{{ $labels.pod }}` }} has recorded {{ `{{ $value }}` }} deadlock
            conflicts, past the {{ .Values.prometheusRule.maxDeadlocks }}
            threshold.

      - alert: ReplicaFailingReplication
        expr: |
          cnpg_pg_replication_in_recovery{job="{{ .Release.Namespace }}/{{ include "cnpg-database.fullname" . }}"} > cnpg_pg_replication_is_wal_receiver_up{job="{{ .Release.Namespace }}/{{ include "cnpg-database.fullname" . }}"}
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Replica of {{ `{{ $labels.job }}` }} is not replicating
          description: >-
            {{ `{{ $labels.pod }}` }} is in recovery but its WAL receiver is down,
            so it has stopped following the primary.
