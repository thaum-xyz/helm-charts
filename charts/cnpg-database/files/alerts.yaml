groups:
  - name: cnpg-database-backups
    rules:
      # Built on the barman plugin's own metrics, not cnpg_collector_*. The
      # built-in collector metrics report 0 for plugin-method backups, so an
      # alert on them fires forever while telling you nothing.
      #
      # Aggregated by job, which the PodMonitor pins to the cluster name via
      # jobLabel. max() picks the primary: replicas report 0.
      #
      # Selected on this release's own job and namespace. Every database
      # installs this chart, so without it each release evaluates the same
      # cluster-wide query and the fleet loads one identical copy of each alert
      # per release. Namespace alone would not be enough -- vod-arr holds three
      # clusters -- and job alone would not either, three clusters being called
      # "postgres" in different namespaces.
      - alert: CNPGBackupTooOld
        expr: |
          time() - max by (namespace, job) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{job="{{ include "cnpg-database.fullname" . }}", namespace="{{ .Release.Namespace }}"} > 0)
            > {{ .Values.prometheusRule.maxBackupAgeSeconds }}
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL backup for {{ `{{ $labels.job }}` }} is stale
          description: >-
            The newest barman-cloud backup for {{ `{{ $labels.job }}` }} is
            {{ `{{ $value | humanizeDuration }}` }} old, past the
            {{ .Values.prometheusRule.maxBackupAgeSeconds }}s threshold. Check
            the ScheduledBackup status: if lastCheckTime is frozen the controller
            may be stuck retrying an already-existing Backup name.

      - alert: CNPGBackupMissing
        expr: |
          max by (namespace, job) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{job="{{ include "cnpg-database.fullname" . }}", namespace="{{ .Release.Namespace }}"}) == 0
        for: 6h
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL cluster {{ `{{ $labels.job }}` }} has no backup
          description: >-
            No barman-cloud backup has ever been recorded for
            {{ `{{ $labels.job }}` }}. CloudNativePG PVCs are owned by the
            Cluster and the storage class reclaims on delete, so this cluster has
            no recovery path at all.

      - alert: CNPGBackupFailing
        expr: |
          max by (namespace, job) (barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp{job="{{ include "cnpg-database.fullname" . }}", namespace="{{ .Release.Namespace }}"})
            > max by (namespace, job) (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{job="{{ include "cnpg-database.fullname" . }}", namespace="{{ .Release.Namespace }}"})
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL backup for {{ `{{ $labels.job }}` }} is failing
          description: >-
            The last backup attempt for {{ `{{ $labels.job }}` }} failed more
            recently than the last success, so backups are running but not
            completing.

  # Moved here from a single cluster-wide PrometheusRule that lived alongside the
  # CNPG operator. Every rule in it described databases running in other
  # namespaces, and every release matched every other release's clusters, so a
  # threshold could not be tuned for one database without moving it for all
  # eleven. Scoped by job -- "<namespace>/<cluster>" -- for the same reason the
  # backup rules above are.
  - name: cnpg-database
    rules:
      - alert: CNPGLongRunningTransaction
        expr: |
          cnpg_backends_max_tx_duration_seconds{job="{{ include "cnpg-database.fullname" . }}", namespace="{{ .Release.Namespace }}"} > {{ .Values.prometheusRule.maxTransactionSeconds }}
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: A transaction on {{ `{{ $labels.job }}` }} has been open too long
          description: >-
            A backend on {{ `{{ $labels.pod }}` }} has held a transaction open for
            {{ `{{ $value | humanizeDuration }}` }}, past the
            {{ .Values.prometheusRule.maxTransactionSeconds }}s threshold. A
            transaction left open holds back vacuum and can block other writers.

      # Upstream annotates this as "waiting longer than 5 minutes", which
      # misreads the metric: cnpg_backends_waiting_total counts backends blocked
      # on locks, it is not a duration.
      - alert: CNPGBackendsWaiting
        expr: |
          cnpg_backends_waiting_total{job="{{ include "cnpg-database.fullname" . }}", namespace="{{ .Release.Namespace }}"} > {{ .Values.prometheusRule.maxBackendsWaiting }}
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Backends on {{ `{{ $labels.job }}` }} are blocked on locks
          description: >-
            {{ `{{ $value }}` }} backends on {{ `{{ $labels.pod }}` }} are waiting
            on locks, past the {{ .Values.prometheusRule.maxBackendsWaiting }}
            threshold.

      - alert: CNPGDatabaseXIDAge
        expr: |
          cnpg_pg_database_xid_age{job="{{ include "cnpg-database.fullname" . }}", namespace="{{ .Release.Namespace }}"} > {{ .Values.prometheusRule.maxXidAge }}
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Transaction ID age on {{ `{{ $labels.job }}` }} is high
          description: >-
            {{ `{{ $labels.pod }}` }} is {{ `{{ $value }}` }} transactions past
            its frozen XID. Left unchecked this ends in a wraparound shutdown.

      - alert: CNPGReplicationLag
        expr: |
          cnpg_pg_replication_lag{job="{{ include "cnpg-database.fullname" . }}", namespace="{{ .Release.Namespace }}"} > {{ .Values.prometheusRule.maxReplicationLagSeconds }}
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Standby of {{ `{{ $labels.job }}` }} is lagging
          description: >-
            The standby is {{ `{{ $value | humanizeDuration }}` }} behind the
            primary, past the
            {{ .Values.prometheusRule.maxReplicationLagSeconds }}s threshold.

      # A single failed archive is not an incident. The archive_command retries
      # within seconds, PostgreSQL holds the segment in pg_wal until it lands,
      # and last_archived_time overtakes last_failed_time on the next success.
      # At 1m this paged three times in one minute on 2026-09-03, when an fio run
      # saturated the NFS export behind the versitygw gateway every cluster
      # archives through: four primaries recorded exactly one failed archive
      # each, the backlog peaked at one segment, and archiving recovered in 40
      # seconds unaided. 15m is long enough that only a failure the retry loop
      # cannot clear reaches a human, and short enough to still beat the
      # backlog alert below.
      - alert: CNPGLastFailedArchiveTime
        expr: |
          (cnpg_pg_stat_archiver_last_failed_time{job="{{ include "cnpg-database.fullname" . }}", namespace="{{ .Release.Namespace }}"} - cnpg_pg_stat_archiver_last_archived_time{job="{{ include "cnpg-database.fullname" . }}", namespace="{{ .Release.Namespace }}"}) > 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: WAL archiving on {{ `{{ $labels.job }}` }} is failing
          description: >-
            {{ `{{ $labels.pod }}` }} has failed to archive WAL more recently than
            it last succeeded for 15m, so the retry loop is not clearing it.
            Recovery depends on an unbroken WAL chain.

      # The alert above says archiving is broken; this one says it is doing
      # damage. Segments in archive_status/ready are the ones PostgreSQL may not
      # recycle, so a backlog that will not drain ends with pg_wal filling the
      # data volume and the primary shutting down. Steady state is 0 ready.
      #
      # cnpg_collector_* is trustworthy here, unlike for the backup metrics
      # above: these counters come from PostgreSQL's own archiver state and read
      # correctly under the plugin backup method.
      #
      # max() picks the primary, as with the backup alerts: only the primary
      # archives, and replicas report 0.
      - alert: CNPGWALArchiveBacklog
        expr: |
          max by (namespace, job) (cnpg_collector_pg_wal_archive_status{value="ready", job="{{ include "cnpg-database.fullname" . }}", namespace="{{ .Release.Namespace }}"})
            > {{ .Values.prometheusRule.maxWalSegmentsReady }}
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: WAL archive backlog on {{ `{{ $labels.job }}` }} is not draining
          description: >-
            {{ `{{ $value }}` }} WAL segments are waiting to be archived, past the
            {{ .Values.prometheusRule.maxWalSegmentsReady }} threshold, and have
            not drained in 30m. PostgreSQL cannot recycle them, so pg_wal grows
            until the archive target accepts them or the data volume fills.

      - alert: CNPGDatabaseDeadlockConflicts
        expr: |
          cnpg_pg_stat_database_deadlocks{job="{{ include "cnpg-database.fullname" . }}", namespace="{{ .Release.Namespace }}"} > {{ .Values.prometheusRule.maxDeadlocks }}
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Deadlocks on {{ `{{ $labels.job }}` }}
          description: >-
            {{ `{{ $labels.pod }}` }} has recorded {{ `{{ $value }}` }} deadlock
            conflicts, past the {{ .Values.prometheusRule.maxDeadlocks }}
            threshold.

      - alert: CNPGReplicaFailingReplication
        expr: |
          cnpg_pg_replication_in_recovery{job="{{ include "cnpg-database.fullname" . }}", namespace="{{ .Release.Namespace }}"} > cnpg_pg_replication_is_wal_receiver_up{job="{{ include "cnpg-database.fullname" . }}", namespace="{{ .Release.Namespace }}"}
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Replica of {{ `{{ $labels.job }}` }} is not replicating
          description: >-
            {{ `{{ $labels.pod }}` }} is in recovery but its WAL receiver is down,
            so it has stopped following the primary.
