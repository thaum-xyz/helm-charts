{{- if and .Values.externalSecrets.enabled .Values.backup.enabled (not .Values.backup.objectStore.credentials.secretName) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "cnpg-database.backupSecret" . }}
  labels: {{- include "cnpg-database.labels" . | nindent 4 }}
  {{- with .Values.externalSecrets.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  data:
    - remoteRef:
        key: {{ .Values.externalSecrets.backup.accessKeyRemoteKey }}
      secretKey: {{ .Values.backup.objectStore.credentials.accessKeyKey }}
    - remoteRef:
        key: {{ .Values.externalSecrets.backup.secretKeyRemoteKey }}
      secretKey: {{ .Values.backup.objectStore.credentials.secretKeyKey }}
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef: {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ include "cnpg-database.backupSecret" . }}
    {{- with .Values.externalSecrets.secret.metadata }}
    template:
      # mergePolicy Merge is load-bearing. This template carries metadata only,
      # and the default policy (Replace) keeps *just* the templated content --
      # which for a data-less template means a Secret with no keys at all,
      # silently breaking the object store credentials. Merge embeds the keys
      # fetched by spec.data alongside the metadata.
      #
      # The admin and user ExternalSecrets do not need this: they template their
      # data explicitly, so Replace is correct there.
      mergePolicy: Merge
      metadata: {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
