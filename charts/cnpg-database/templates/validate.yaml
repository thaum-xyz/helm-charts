{{- if and .Values.podMonitor.enabled .Values.cluster.monitoring.enablePodMonitor }}
{{- fail "cluster.monitoring.enablePodMonitor and podMonitor.enabled are both true: the operator and the chart would each create a PodMonitor over the same pods and port, so every instance is scraped twice under two different job labels" }}
{{- end }}
{{- if and .Values.pooler.enabled .Values.podMonitor.enabled .Values.pooler.monitoring.enablePodMonitor }}
{{- fail "pooler.monitoring.enablePodMonitor and podMonitor.enabled are both true: the operator and the chart would each create a PodMonitor over the pooler pods, so every replica is scraped twice under two different job labels" }}
{{- end }}
{{- if and .Values.cluster.bootstrap.enabled (not .Values.database) }}
{{- fail "database is required when cluster.bootstrap.enabled" }}
{{- end }}
{{- if and .Values.backup.enabled (not .Values.backup.objectStore.destinationPath) (not .Values.backup.objectStore.pathSuffix) }}
{{- fail "backup.objectStore.pathSuffix or backup.objectStore.destinationPath must be set when backup.enabled" }}
{{- end }}
{{- if and .Values.externalSecrets.enabled (not .Values.externalSecrets.admin.remoteKey) }}
{{- fail "externalSecrets.admin.remoteKey is required" }}
{{- end }}
{{- if and .Values.externalSecrets.enabled (not .Values.externalSecrets.user.remoteKey) }}
{{- fail "externalSecrets.user.remoteKey is required" }}
{{- end }}
{{- if and (not .Values.database) (not .Values.owner) .Values.externalSecrets.enabled }}
{{- fail "owner or database must be set: it becomes the username in the user ExternalSecret" }}
{{- end }}
